name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm}
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: python scripts/editor-fonts.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npx playwright test --config playwright.editor.config.js
      - name: Validate production deployment files
        env:
          IMAGE_PREFIX: ghcr.io/example/project-tracker
          IMAGE_TAG: ${{ github.sha }}
          SETUP_TOKEN_FILE: /tmp/unused-setup-key
        run: |
          bash -n deploy/install.sh deploy/ssh-deploy.sh
          docker compose -f compose.yaml --profile agents config --quiet
          docker compose -f deploy/compose.yaml --profile agents config --quiet
      - name: Parse PowerShell bootstrap
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'init.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - {name: app, dockerfile: Dockerfile, target: app}
          - {name: latex, dockerfile: docker/latex/Dockerfile, target: ''}
          - {name: codex, dockerfile: docker/codex/Dockerfile, target: ''}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env: {REPOSITORY: '${{ github.repository }}'}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Smoke-test the built image before publishing
        env:
          IMAGE: ${{ steps.image.outputs.prefix }}/${{ matrix.name }}:${{ github.sha }}
          SERVICE: ${{ matrix.name }}
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true --entrypoint python "$IMAGE" /usr/local/bin/check-release-image.py "$SERVICE"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.prefix }}/${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    environment: production
    concurrency: {group: production-deployment, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with: {persist-credentials: false}
      - name: Deploy exact tested commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_DOMAIN: project.counthom.org
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deploy/ssh-deploy.sh
